name: Deploy Database Production

on:
  workflow_run:
    workflows:
      - Liquibase Validation
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Liquibase to production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/somnguard/repos/somnguard-db

            echo "==> Updating repository"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Running Liquibase migrations"
            docker run --rm \
              --network somnguard-network \
              -v "$PWD:/workspace" \
              somnguard-liquibase:latest \
              --search-path=/workspace \
              --changeLogFile=changelog/changelog-master.yaml \
              --url=jdbc:postgresql://somnguard-postgres:5432/somnguard \
              --username=somnguard \
              --password="$(
                grep '^POSTGRES_PASSWORD=' ~/somnguard/deploy/db/.env \
                | cut -d '=' -f2-
              )" \
              --contexts=01_ddl,02_dml,03_dcl,04_tcl \
              update

            echo "==> Database deployment completed"
            
