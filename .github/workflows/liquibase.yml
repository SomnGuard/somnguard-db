name: Liquibase Validation

on:
  push:
    branches:
      - main
      - qa
      - develop
  pull_request:

jobs:
  liquibase-validate:
    name: Liquibase validation + rollback
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker
        run: |
          docker --version
          docker compose version

      - name: Liquibase validation and rollback verification
        run: |
          bash scripts/verify-rollback.sh